title: FlowPilot Knowledgebase
description: AI Workflow Automation Platform Documentation
remote_theme: just-the-docs/just-the-docs



url: "https://flowpilot.ai" # Placeholder URL

plugins:
  - jekyll-remote-theme

# Theme Settings
color_scheme: "light"
favicon_ico: "/assets/favicon.svg"

# Search
search_enabled: true
search:
  button: true
  tokenizer_separator: /[\s/]+/
  preview_words_before: 5
  preview_words_after: 10
  rel_url: true
  heading_level: 2
  truncate_length: 50

# Navigation
nav_sort: case_insensitive

# Footer
footer_content: "© 2026 FlowPilot Inc. All rights reserved."

# Callouts
callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
